<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 幸运抽奖转转转</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .nav-tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }

        .nav-tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            border: none;
            background: transparent;
            font-size: 16px;
            transition: all 0.3s;
        }

        .nav-tab:hover {
            background: #e9ecef;
        }

        .nav-tab.active {
            background: white;
            color: #667eea;
            font-weight: bold;
            border-bottom: 3px solid #667eea;
        }

        .content {
            padding: 30px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 抽奖转盘样式 - 使用Canvas */
        .wheel-container {
            position: relative;
            width: 350px;
            height: 350px;
            margin: 0 auto 30px;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        .wheel-pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 50px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 10;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 5;
            cursor: pointer;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349, #f45c43);
            color: white;
        }

        .prize-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .prize-info h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .prize-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .prize-item {
            background: white;
            padding: 10px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .prize-item.real {
            border-left: 4px solid #27ae60;
        }

        .prize-item.thanks {
            border-left: 4px solid #95a5a6;
            opacity: 0.7;
        }

        /* 管理员面板样式 */
        .admin-login {
            text-align: center;
            padding: 40px;
        }

        .admin-panel {
            display: none;
        }

        .admin-panel.active {
            display: block !important;
        }

        .prize-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
        }

        .form-row input {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
        }

        .form-row input[type="number"] {
            width: 100px;
            flex: none;
        }

        .form-row select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
        }

        .prize-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .prize-table th,
        .prize-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .prize-table th {
            background: #f8f9fa;
            font-weight: bold;
        }

        .prize-table tr:hover {
            background: #f8f9fa;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 20px;
        }

        /* 中奖记录样式 */
        .records-filter {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .records-filter input,
        .records-filter select {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
        }

        .records-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .record-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .record-item.winner {
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            border-left: 4px solid #28a745;
        }

        .record-item.thanks-record {
            opacity: 0.6;
        }

        .record-info h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .record-info p {
            color: #666;
            font-size: 14px;
        }

        .record-prize {
            font-weight: bold;
            color: #667eea;
        }

        .record-item.winner .record-prize {
            color: #28a745;
        }

        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            animation: modalPop 0.3s ease;
        }

        @keyframes modalPop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .modal-text {
            color: #666;
            margin-bottom: 25px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .wheel-container {
                width: 280px;
                height: 280px;
            }

            .prize-list {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .form-row {
                flex-direction: column;
                align-items: stretch;
            }

            .form-row input[type="number"] {
                width: 100%;
            }
        }
    </style>
    <!-- 引入 QRCode 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎁 幸运抽奖转转转</h1>
            <p>每周一次，好运连连！100人参与，随机抽取幸运儿</p>
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active" data-tab="lottery" onclick="switchTab('lottery')">🎲 参与抽奖</button>
            <button class="nav-tab" data-tab="records" onclick="switchTab('records')">📋 中奖记录</button>
            <button class="nav-tab" data-tab="admin" onclick="switchTab('admin')">🔐 管理员</button>
        </div>

        <div class="content">
            <!-- 抽奖页面 -->
            <div id="lottery" class="tab-content active">
                <div class="wheel-container">
                    <div class="wheel-pointer"></div>
                    <canvas id="wheelCanvas" width="350" height="350"></canvas>
                    <div class="wheel-center">🎁</div>
                </div>

                <div class="prize-info">
                    <h3>🎁 本期奖品</h3>
                    <div class="prize-list" id="prizeList"></div>
                </div>

                <div class="input-group">
                    <label for="phone">📱 请输入手机号（用于领奖验证）</label>
                    <input type="tel" id="phone" placeholder="请输入11位手机号" maxlength="11">
                </div>

                <div style="text-align: center;">
                    <button class="btn btn-primary" id="drawBtn" onclick="startDraw()">
                        🎲 立即抽奖
                    </button>
                </div>

                <div style="margin-top: 20px; padding: 15px; background: #fff3cd; border-radius: 10px; font-size: 14px; color: #856404;">
                    <strong>📌 活动规则：</strong><br>
                    1. 每人每周仅限参与一次<br>
                    2. 中奖后凭手机号领奖<br>
                    3. 奖品数量有限，抽完即止
                </div>
            </div>

            <!-- 中奖记录页面 -->
            <div id="records" class="tab-content">
                <h2 style="margin-bottom: 20px;">📋 抽奖记录</h2>
                
                <div class="records-filter">
                    <input type="text" id="searchPhone" placeholder="搜索手机号">
                    <select id="filterPrize">
                        <option value="">全部奖品</option>
                    </select>
                    <button class="btn btn-primary btn-small" onclick="filterRecords()">🔍 搜索</button>
                    <button class="btn btn-small" style="background: #6c757d; color: white;" onclick="resetFilter()">重置</button>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="totalDraws">0</div>
                        <div class="stat-label">总参与人次</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="totalWinners">0</div>
                        <div class="stat-label">中奖人数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="remainingPrizes">0</div>
                        <div class="stat-label">剩余奖品</div>
                    </div>
                </div>

                <div class="records-list" id="recordsList">
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>暂无抽奖记录</p>
                    </div>
                </div>
            </div>

            <!-- 管理员页面 -->
            <div id="admin" class="tab-content">
                <div id="adminLogin" class="admin-login">
                    <h2 style="margin-bottom: 20px;">🔐 管理员登录</h2>
                    <div class="input-group" style="max-width: 300px; margin: 0 auto 20px;">
                        <input type="password" id="adminPassword" placeholder="请输入管理员密码">
                    </div>
                    <button class="btn btn-primary" onclick="adminLogin()">登录</button>
                </div>

                <div id="adminPanel" class="admin-panel">
                    <h2 style="margin-bottom: 20px;">⚙️ 奖品管理</h2>
                    
                    <div class="prize-form">
                        <h3 style="margin-bottom: 15px;">添加/编辑奖品</h3>
                        <div class="form-row">
                            <input type="text" id="prizeName" placeholder="奖品名称">
                            <input type="number" id="prizeCount" placeholder="数量" min="0">
                            <select id="prizeType">
                                <option value="real">实物奖品</option>
                                <option value="thanks">谢谢参与</option>
                            </select>
                        </div>
                        <button class="btn btn-success" onclick="savePrize()">💾 保存奖品</button>
                        <button class="btn" style="background: #6c757d; color: white; margin-left: 10px;" onclick="resetPrizeForm()">清空</button>
                    </div>

                    <h3>奖品列表</h3>
                    <table class="prize-table">
                        <thead>
                            <tr>
                                <th>奖品名称</th>
                                <th>类型</th>
                                <th>剩余数量</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="adminPrizeList"></tbody>
                    </table>

                    <div style="margin-top: 30px; padding: 20px; background: #e8f4f8; border-radius: 15px;">
                        <h3 style="margin-bottom: 15px;">📱 数据同步</h3>
                        <button type="button" class="btn btn-primary" onclick="savePrizesToCloud()">📱 生成同步二维码</button>
                        <p style="margin-top: 10px; color: #666; font-size: 12px;">点击生成二维码，手机扫描即可同步最新奖品配置</p>
                    </div>

                    <div style="margin-top: 30px; padding: 20px; background: #e8f4f8; border-radius: 15px;">
                        <h3 style="margin-bottom: 15px;">📊 数据导出（Excel格式）</h3>
                        <button type="button" id="exportRecordsBtn" class="btn btn-success">📋 导出抽奖记录</button>
                        <button type="button" id="exportPrizesBtn" class="btn btn-success" style="margin-left: 10px;">🎁 导出奖品配置</button>
                        <button type="button" id="exportAllBtn" class="btn btn-primary" style="margin-left: 10px;">📦 导出全部数据</button>
                    </div>

                    <div style="margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 15px;">
                        <h3 style="margin-bottom: 15px;">⚠️ 危险操作</h3>
                        <button type="button" id="clearRecordsBtn" class="btn btn-danger">🗑️ 清空所有记录</button>
                        <button type="button" id="resetDataBtn" class="btn btn-danger" style="margin-left: 10px;">🔄 重置所有数据</button>
                    </div>

                    <div style="margin-top: 20px; text-align: right;">
                        <button class="btn" style="background: #6c757d; color: white;" onclick="adminLogout()">退出登录</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 抽奖结果弹窗 -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <div class="modal-icon" id="resultIcon">🎉</div>
            <h2 class="modal-title" id="resultTitle">恭喜你！</h2>
            <p class="modal-text" id="resultText">你抽中了奖品！</p>
            <button class="btn btn-primary" onclick="closeModal()">确定</button>
        </div>
    </div>

    <!-- 加载中提示 -->
    <div id="loadingModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 30px; border-radius: 10px; text-align: center;">
            <div style="font-size: 40px; margin-bottom: 10px;">⏳</div>
            <p>正在同步数据...</p>
        </div>
    </div>

    <script>
        // ==================== 配置 ====================
        let isCloudReady = false;
        
        // 从 URL 参数获取同步数据
        function getUrlParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }
        
        // ==================== 数据存储 ====================
        const STORAGE_KEYS = {
            PRIZES: 'lottery_prizes_v2',
            RECORDS: 'lottery_records_v2',
            PARTICIPANTS: 'lottery_participants_v2'
        };

        // 默认奖品配置 - 交错排列：每两个彩色之间夹1-2个灰色
        const DEFAULT_PRIZES = [
            { id: 1, name: 'AD钙奶', count: 5, type: 'real', color: '#3498db' },
            { id: 2, name: '谢谢参与', count: 999999, type: 'thanks', color: '#95a5a6' },
            { id: 3, name: '棉花糖', count: 10, type: 'real', color: '#e91e63' },
            { id: 4, name: '谢谢参与', count: 999999, type: 'thanks', color: '#7f8c8d' },
            { id: 5, name: '谢谢参与', count: 999999, type: 'thanks', color: '#95a5a6' },
            { id: 6, name: '啤酒', count: 5, type: 'real', color: '#f39c12' },
            { id: 7, name: '谢谢参与', count: 999999, type: 'thanks', color: '#7f8c8d' },
            { id: 8, name: '牛奶', count: 5, type: 'real', color: '#ecf0f1' },
            { id: 9, name: '谢谢参与', count: 999999, type: 'thanks', color: '#95a5a6' },
            { id: 10, name: '谢谢参与', count: 999999, type: 'thanks', color: '#7f8c8d' }
        ];

        let currentPrizes = [];
        let isSpinning = false;
        let editingPrizeId = null;
        let currentRotation = 0;
        let isAdminLoggedIn = false;

        // ==================== 初始化 ====================
        async function init() {
            showLoading('正在初始化...');
            
            // 初始化云开发
            await initCloud();
            
            // 加载数据
            await loadPrizes();
            drawWheel();
            renderPrizeList();
            renderRecords();
            updateStats();
            
            hideLoading();
        }
        
        // ==================== 初始化 ====================
        async function initCloud() {
            // GitHub 方案不需要初始化，直接设置为就绪
            isCloudReady = true;
            console.log('GitHub 同步模式已启用');
        }
        
        // 显示/隐藏加载
        function showLoading(text = '加载中...') {
            const modal = document.getElementById('loadingModal');
            modal.querySelector('p').textContent = text;
            modal.style.display = 'flex';
        }
        
        function hideLoading() {
            document.getElementById('loadingModal').style.display = 'none';
        }

        // ==================== 数据操作 ====================
        async function loadPrizes() {
            console.log('开始加载奖品数据...');
            
            // 优先检查 URL 参数中的同步数据
            const syncData = getUrlParam('sync');
            if (syncData) {
                try {
                    const decoded = JSON.parse(atob(decodeURIComponent(syncData)));
                    if (decoded.prizes && Array.isArray(decoded.prizes)) {
                        currentPrizes = decoded.prizes;
                        localStorage.setItem(STORAGE_KEYS.PRIZES, JSON.stringify(currentPrizes));
                        console.log('从同步参数加载奖品配置成功:', JSON.stringify(currentPrizes));
                        isCloudReady = true;
                        // 清除 URL 参数
                        window.history.replaceState({}, document.title, window.location.pathname);
                        return;
                    }
                } catch (e) {
                    console.error('同步参数解析失败:', e);
                }
            }
            
            // 降级到本地存储
            loadPrizesFromLocal();
            isCloudReady = false;
        }
        
        function loadPrizesFromLocal() {
            const saved = localStorage.getItem(STORAGE_KEYS.PRIZES);
            if (saved) {
                currentPrizes = JSON.parse(saved);
            } else {
                currentPrizes = JSON.parse(JSON.stringify(DEFAULT_PRIZES));
                localStorage.setItem(STORAGE_KEYS.PRIZES, JSON.stringify(currentPrizes));
            }
        }

        async function savePrizesToStorage() {
            // 保存到本地
            localStorage.setItem(STORAGE_KEYS.PRIZES, JSON.stringify(currentPrizes));
            console.log('奖品已保存到本地');
        }
        
        async function savePrizesToCloud() {
            try {
                console.log('生成同步二维码...', currentPrizes);
                
                // 准备数据
                const content = {
                    prizes: currentPrizes,
                    updateTime: new Date().toISOString()
                };
                
                // 生成同步链接
                const baseUrl = window.location.origin + window.location.pathname;
                const syncParam = encodeURIComponent(btoa(JSON.stringify(content)));
                const syncUrl = `${baseUrl}?sync=${syncParam}`;
                
                // 显示同步二维码
                showSyncQRCode(syncUrl);
                
                console.log('同步链接已生成');
            } catch (e) {
                console.error('生成同步链接失败:', e);
                alert('生成同步链接失败: ' + e.message);
            }
        }
        
        // 显示同步二维码

                } catch (e) {

            if (isCloudReady) {

        function getParticipantsFromLocal() {

        async function saveParticipant(phone, weekKey) {
            const participants = await getParticipants();
            if (!participants[weekKey]) {
                participants[weekKey] = [];
            }
            if (!participants[weekKey].includes(phone)) {
                participants[weekKey].push(phone);
            }
            
            // 保存到本地
            localStorage.setItem(STORAGE_KEYS.PARTICIPANTS, JSON.stringify(participants));
            
            // 保存到云端
            if (isCloudReady) {
                try {
                    const res = await db.collection('participants').get();
                    if (res.data && res.data.length > 0) {
                        await db.collection('participants').doc(res.data[0]._id).update({
                            data: participants,
                            updateTime: new Date().toISOString()
                        });
                    } else {
                        await db.collection('participants').add({
                            data: participants,
                            createTime: new Date().toISOString(),
                            updateTime: new Date().toISOString()
                        });
                    }
                    console.log('参与者记录已同步到云端');
                } catch (e) {
                    console.error('同步参与者到云端失败:', e);
                }
            }
        }

        async function hasParticipatedThisWeek(phone) {
            const weekKey = getWeekKey();
            const participants = await getParticipants();
            return participants[weekKey] && participants[weekKey].includes(phone);
        }

        function getWeekKey() {
            const now = new Date();
            const year = now.getFullYear();
            const week = getWeekNumber(now);
            return `${year}-W${week}`;
        }

        function getWeekNumber(date) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        // ==================== Canvas转盘绘制 ====================
        function drawWheel() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) - 10;

            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const availablePrizes = currentPrizes.filter(p => p.count > 0 || p.type === 'thanks');
            const sectionCount = availablePrizes.length;
            const anglePerSection = (2 * Math.PI) / sectionCount;

            availablePrizes.forEach((prize, index) => {
                const startAngle = index * anglePerSection - Math.PI / 2;
                const endAngle = (index + 1) * anglePerSection - Math.PI / 2;

                // 绘制扇形
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();

                // 设置颜色
                if (prize.type === 'thanks') {
                    // 谢谢参与使用交替的灰色
                    ctx.fillStyle = (index % 2 === 0) ? '#95a5a6' : '#7f8c8d';
                } else {
                    ctx.fillStyle = prize.color || '#3498db';
                }
                ctx.fill();

                // 绘制边框
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 绘制文字
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + anglePerSection / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = prize.name === '牛奶' ? '#333' : '#fff';
                ctx.font = 'bold 13px Microsoft YaHei';
                
                // 文字位置调整
                const textRadius = radius - 35;
                ctx.fillText(prize.name, textRadius, 4);
                ctx.restore();
            });

            // 绘制中心圆
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffd700';
            ctx.fill();
            ctx.strokeStyle = '#ffed4e';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        // ==================== 抽奖逻辑 ====================
        async function startDraw() {
            if (isSpinning) return;

            const phone = document.getElementById('phone').value.trim();
            
            // 验证手机号
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showResult('❌', '手机号格式错误', '请输入正确的11位手机号');
                return;
            }

            showLoading('检查参与记录...');
            
            // 检查本周是否已参与
            const hasParticipated = await hasParticipatedThisWeek(phone);
            if (hasParticipated) {
                hideLoading();
                showResult('⏰', '本周已参与', '每人每周仅限参与一次，下周再来吧！');
                return;
            }

            hideLoading();

            // 检查是否有奖品
            const availableRealPrizes = currentPrizes.filter(p => p.type === 'real' && p.count > 0);
            if (availableRealPrizes.length === 0) {
                showResult('😔', '奖品已抽完', '本期奖品已全部抽完，敬请期待下期活动！');
                return;
            }

            isSpinning = true;
            document.getElementById('drawBtn').disabled = true;

            // 执行抽奖
            const result = performDraw();
            
            // 旋转转盘
            spinWheel(result.index, async () => {
                showLoading('保存记录...');
                
                // 保存参与记录
                await saveParticipant(phone, getWeekKey());
                
                // 保存中奖记录
                const record = {
                    id: Date.now(),
                    phone: phone,
                    prize: result.prize,
                    time: new Date().toLocaleString('zh-CN'),
                    weekKey: getWeekKey()
                };
                await saveRecord(record);

                // 如果是实物奖品，减少库存
                if (result.prize.type === 'real') {
                    const prizeIndex = currentPrizes.findIndex(p => p.id === result.prize.id);
                    if (prizeIndex !== -1) {
                        currentPrizes[prizeIndex].count--;
                        await savePrizesToStorage();
                    }
                }

                hideLoading();
                
                // 显示结果
                setTimeout(() => {
                    if (result.prize.type === 'thanks') {
                        showResult('😊', '谢谢参与', '很遗憾，这次没有中奖，下周再来试试吧！');
                    } else {
                        showResult('🎉', '恭喜你中奖了！', `你抽中了：${result.prize.name}<br>请凭手机号 ${phone} 领奖`);
                    }
                    
                    // 更新显示
                    renderPrizeList();
                    drawWheel();
                    updateStats();
                    
                    isSpinning = false;
                    document.getElementById('drawBtn').disabled = false;
                }, 500);
            });
        }

        function performDraw() {
            const availablePrizes = currentPrizes.filter(p => p.count > 0 || p.type === 'thanks');
            
            // 构建加权数组（谢谢参与占更大权重）
            let weightedPool = [];
            availablePrizes.forEach((prize, index) => {
                const weight = prize.type === 'thanks' ? 3 : 1;
                for (let i = 0; i < weight; i++) {
                    weightedPool.push({ prize, index });
                }
            });

            // 随机选择
            const randomIndex = Math.floor(Math.random() * weightedPool.length);
            return weightedPool[randomIndex];
        }

        function spinWheel(targetIndex, callback) {
            const canvas = document.getElementById('wheelCanvas');
            const availablePrizes = currentPrizes.filter(p => p.count > 0 || p.type === 'thanks');
            const sectionCount = availablePrizes.length;
            const anglePerSection = 360 / sectionCount;
            
            // 计算目标角度（让指针指向选中扇形的中间）
            const targetAngle = 360 - (targetIndex * anglePerSection + anglePerSection / 2);
            
            // 添加多圈旋转
            const spins = 5 + Math.floor(Math.random() * 3);
            const finalAngle = currentRotation + spins * 360 + (targetAngle - (currentRotation % 360));
            
            currentRotation = finalAngle;
            
            // 使用CSS动画
            canvas.style.transition = 'transform 4s cubic-bezier(0.23, 1, 0.32, 1)';
            canvas.style.transform = `rotate(${finalAngle}deg)`;
            
            setTimeout(callback, 4000);
        }

                    const res = await db.collection('draw_records').get();
                    for (const doc of res.data || []) {
                        await db.collection('draw_records').doc(doc._id).remove();
                    }
                    await db.collection('participants').remove();
                }
                
                console.log('Records cleared');
                hideLoading();
                alert('记录已清空！');
                updateStats();
            } catch (e) {
                hideLoading();
                console.error('Error clearing records:', e);
                alert('清空失败：' + e.message);
            }
        }

        // 重置所有数据
        async function resetAllData() {
            console.log('resetAllData called');
            if (!confirm('⚠️ 确定要重置所有数据吗？这将恢复默认奖品配置并清空所有记录！')) {
                console.log('Reset all data cancelled by user');
                return;
            }
            
            showLoading('重置中...');
            
            try {
                localStorage.removeItem(STORAGE_KEYS.PRIZES);
                localStorage.removeItem(STORAGE_KEYS.RECORDS);
                localStorage.removeItem(STORAGE_KEYS.PARTICIPANTS);
                
                // 重置云端数据
                if (isCloudReady) {
                    // 清空记录
                    const recordsRes = await db.collection('draw_records').get();
                    for (const doc of recordsRes.data || []) {
                        await db.collection('draw_records').doc(doc._id).remove();
                    }
                    // 清空参与者
                    await db.collection('participants').remove();
                }
                
                console.log('All data cleared');
                
                currentPrizes = JSON.parse(JSON.stringify(DEFAULT_PRIZES));
                await savePrizesToStorage();
                console.log('Default prizes restored');
                
                hideLoading();
                
                renderAdminPrizeList();
                renderPrizeList();
                drawWheel();
                updateStats();
                alert('数据已重置！');
            } catch (e) {
                hideLoading();
                console.error('Error resetting data:', e);
                alert('重置失败：' + e.message);
            }
        }

        // ==================== 数据导出功能 ====================
        
        // 导出抽奖记录为CSV
        async function exportRecords() {
            showLoading('加载记录...');
            const records = await getRecords();
            hideLoading();
            if (records.length === 0) {
                alert('暂无抽奖记录可导出！');
                return;
            }
            
            // CSV 表头
            const headers = ['序号', '手机号', '奖品名称', '奖品类型', '抽奖时间', '周次'];
            
            // CSV 数据行
            const rows = records.map((record, index) => [
                index + 1,
                record.phone,
                record.prize.name,
                record.prize.type === 'real' ? '实物奖品' : '谢谢参与',
                record.time,
                record.weekKey
            ]);
            
            // 生成CSV内容
            const csvContent = [headers, ...rows]
                .map(row => row.map(cell => `"${cell}"`).join(','))
                .join('\n');
            
            // 添加BOM以支持中文
            const BOM = '\uFEFF';
            const blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' });
            
            // 下载文件
            const timestamp = new Date().toLocaleString('zh-CN').replace(/[/:]/g, '-');
            downloadFile(blob, `抽奖记录_${timestamp}.csv`);
            
            alert(`成功导出 ${records.length} 条抽奖记录！`);
        }
        
        // 导出奖品配置为CSV（Excel格式）
        function exportPrizes() {
            if (currentPrizes.length === 0) {
                alert('暂无奖品配置可导出！');
                return;
            }
            
            // CSV 表头
            const headers = ['序号', '奖品ID', '奖品名称', '奖品类型', '数量', '颜色'];
            
            // CSV 数据行
            const rows = currentPrizes.map((prize, index) => [
                index + 1,
                prize.id,
                prize.name,
                prize.type === 'real' ? '实物奖品' : '谢谢参与',
                prize.type === 'thanks' ? '∞' : prize.count,
                prize.color
            ]);
            
            // 生成CSV内容
            const csvContent = [headers, ...rows]
                .map(row => row.map(cell => `"${cell}"`).join(','))
                .join('\n');
            
            // 添加BOM以支持中文
            const BOM = '\uFEFF';
            const blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' });
            
            // 下载文件
            const timestamp = new Date().toLocaleString('zh-CN').replace(/[/:]/g, '-');
            downloadFile(blob, `奖品配置_${timestamp}.csv`);
            
            alert(`成功导出 ${currentPrizes.length} 个奖品配置！`);
        }
        
        // 导出全部数据为CSV（包含多个工作表信息）
        async function exportAllData() {
            showLoading('加载数据...');
            const records = await getRecords();
            hideLoading();
            const timestamp = new Date().toLocaleString('zh-CN').replace(/[/:]/g, '-');
            
            // 构建完整的CSV内容，包含多个部分
            let csvContent = '';
            
            // 第一部分：概览信息
            csvContent += '抽奖数据导出概览\n';
            csvContent += `导出时间,${new Date().toLocaleString('zh-CN')}\n`;
            csvContent += `奖品数量,${currentPrizes.length}\n`;
            csvContent += `抽奖记录数,${records.length}\n`;
            csvContent += '\n\n';
            
            // 第二部分：奖品配置
            csvContent += '奖品配置\n';
            csvContent += '序号,奖品ID,奖品名称,奖品类型,数量,颜色\n';
            currentPrizes.forEach((prize, index) => {
                csvContent += `${index + 1},${prize.id},"${prize.name}",${prize.type === 'real' ? '实物奖品' : '谢谢参与'},${prize.type === 'thanks' ? '∞' : prize.count},${prize.color}\n`;
            });
            csvContent += '\n\n';
            
            // 第三部分：抽奖记录
            csvContent += '抽奖记录\n';
            csvContent += '序号,手机号,奖品名称,奖品类型,抽奖时间,周次\n';
            records.forEach((record, index) => {
                csvContent += `${index + 1},${record.phone},"${record.prize.name}",${record.prize.type === 'real' ? '实物奖品' : '谢谢参与'},${record.time},${record.weekKey}\n`;
            });
            
            // 添加BOM以支持中文
            const BOM = '\uFEFF';
            const blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' });
            
            downloadFile(blob, `抽奖工具完整数据_${timestamp}.csv`);
            
            alert(`成功导出完整数据！\n奖品数量：${currentPrizes.length}\n抽奖记录：${records.length} 条`);
        }
        
        // 通用下载文件函数
        function downloadFile(blob, filename) {
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // ==================== 启动 ====================
        init();
    </script>
